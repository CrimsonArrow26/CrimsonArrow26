name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.gif?palette=github
            dist/github-snake-dark.gif?palette=github-dark&color_background=#0d1117

      - name: Push to output branch
        run: |
          rm -rf snake-output
          mkdir snake-output
          cp dist/github-snake.gif snake-output/
          cp dist/github-snake-dark.gif snake-output/
          cd snake-output
          git init
          git checkout -b output
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-snake.gif github-snake-dark.gif
          git commit -m "chore: update contribution snake"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
