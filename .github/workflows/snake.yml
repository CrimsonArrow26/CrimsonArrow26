name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: CrimsonArrow26
          outputs: |
            dist/github-snake.svg?color_snake=808080&color_dots=E5E5E5,BDBDBD,9E9E9E,666666,222222
            dist/github-snake-dark.svg?palette=github-dark&color_snake=808080&color_dots=E5E5E5,BDBDBD,9E9E9E,666666,222222

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
