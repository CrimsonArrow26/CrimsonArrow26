name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: CrimsonArrow26
          outputs: |
            dist/github-snake.svg?color_snake=222222&color_dots=EEEEEE,CCCCCC,999999,555555,222222
            dist/github-snake-dark.svg?palette=github-dark&color_snake=CCCCCC&color_dots=1a1a1a,404040,666666,999999,CCCCCC

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
